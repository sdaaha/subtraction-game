<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة عالم الحيوانات الممتعة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(135deg, #74b9ff, #a29bfe); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #2d3436; 
            box-sizing: border-box;
        }

        .game-container { 
            background: #ffffff; 
            width: 90%; 
            max-width: 650px; 
            border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            padding: 30px; 
            text-align: center; 
            position: relative; 
            overflow: hidden; 
        }

        /* شاشة البداية */
        #welcome-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }

        .characters-row { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            margin: 20px 0; 
        }

        .char-avatar { 
            font-size: 60px; 
            animation: bounce 1.5s infinite alternate; 
        }

        @keyframes bounce { 
            0% { transform: translateY(0); } 
            100% { transform: translateY(-15px); } 
        }

        h1 { 
            color: #0984e3; 
            font-size: 28px; 
            margin-bottom: 10px; 
        }

        p.subtitle { 
            font-size: 16px; 
            color: #636e72; 
            margin-bottom: 25px; 
        }

        .btn-start, .option-btn, .action-btn { 
            background: #00b894; 
            color: white; 
            border: none; 
            padding: 12px 30px; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: 0.3s; 
            box-shadow: 0 5px 15px rgba(0,188,148,0.3); 
            font-family: 'Cairo', sans-serif; 
        }

        .btn-start:hover, .option-btn:hover, .action-btn:hover { 
            background: #00a884; 
            transform: scale(1.05); 
        }

        /* شاشة اللعبة */
        #game-screen { 
            display: none; 
        }

        .game-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            font-weight: bold; 
            color: #b2bec3; 
            font-size: 14px; 
        }

        .question-box { 
            background: #dfe6e9; 
            padding: 20px; 
            border-radius: 15px; 
            font-size: 20px; 
            font-weight: bold; 
            color: #2d3436; 
            margin-bottom: 20px; 
            min-height: 80px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .options-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 20px; 
        }

        .option-btn { 
            background: #0984e3; 
            width: 100%; 
            padding: 15px; 
            box-shadow: 0 5px 15px rgba(9,132,227,0.3); 
        }

        .option-btn:hover { 
            background: #74b9ff; 
        }

        /* مرحلة الكتابة الحرة */
        #text-input-section { 
            display: none; 
            flex-direction: column; 
            gap: 15px; 
            margin-bottom: 20px; 
        }

        #text-input-section input[type="text"] { 
            padding: 15px; 
            font-size: 18px; 
            border: 2px solid #74b9ff; 
            border-radius: 12px; 
            text-align: center; 
            font-family: 'Cairo', sans-serif; 
            outline: none; 
        }

        /* شاشة النهاية */
        #end-screen { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
        }

        .signature { 
            margin-top: 30px; 
            font-size: 18px; 
            font-weight: 900; 
            color: #e84393; 
            letter-spacing: 1px; 
        }

        .feedback { 
            font-size: 16px; 
            font-weight: bold; 
            margin-top: 10px; 
            min-height: 25px; 
        }
    </style>
</head>
<body>

<div class="game-container">

    <!-- شاشة الترحيب -->
    <div id="welcome-screen">
        <h1>مغامرة عالم الحيوانات الممتعة</h1>
        <p class="subtitle">استعدوا لاختبار معلوماتكم عن أسرار وعجائب الحيوانات في 6 مراحل مشوقة!</p>
        
        <div class="characters-row">
            <span class="char-avatar">👦🏻</span>
            <span class="char-avatar">👧🏽</span>
        </div>

        <button class="btn-start" onclick="startGame()">ابدأ المغامرة الآن 🚀</button>
    </div>

    <!-- شاشة اللعب -->
    <div id="game-screen">
        <div class="game-header">
            <span id="stage-number">المرحلة: 1 / 6</span>
            <span id="score-display">النقاط: 0</span>
        </div>

        <div class="question-box" id="question-text">
            جاري تحميل السؤال...
        </div>

        <div id="sound-section" style="display: none; margin-bottom: 15px;">
            <button class="action-btn" onclick="playSound()">🔊 استمع لصوت الحيوان</button>
        </div>

        <div class="options-grid" id="options-container">
            <!-- خيارات الإجابات -->
        </div>

        <div id="text-input-section">
            <input type="text" id="user-answer-input" placeholder="اكتب اسم الحيوان هنا...">
            <button class="action-btn" onclick="checkTextAnswer()">تحقق من الإجابة</button>
        </div>

        <div class="feedback" id="feedback-text"></div>
    </div>

    <!-- شاشة النهاية -->
    <div id="end-screen">
        <h1>أبطال عالم الحيوانات! 🎉</h1>
        <p class="subtitle">مبروك! لقد أكملتم جميع مراحل اللعبة بنجاح.</p>
        
        <div class="characters-row">
            <span class="char-avatar">👦🏻</span>
            <span class="char-avatar">👧🏽</span>
        </div>

        <button class="action-btn" onclick="playSajaGreeting()">🎙️ استمع للتسجيل الصوتي</button>
        <button class="btn-start" onclick="restartGame()" style="margin-top: 15px;">إعادة اللعبة 🔄</button>
        
        <div class="signature">تنفيذ ENG سجا</div>
    </div>

</div>

<script>
    const questions = [
        {
            stage: 1,
            type: 'sound',
            question: "استمع إلى الصوت واختر الحيوان الصحيح:",
            soundUrl: "https://www.soundjay.com/nature/sounds/lion-roar-1.mp3",
            options: ["الأسد", "الفيل", "الذئب", "النمور"],
            answer: "الأسد"
        },
        {
            stage: 2,
            type: 'choice',
            question: "حيوان يمتلك صفة نادرة: هو الحيوان الوحيد الذي لا يستطيع القفز!",
            options: ["الزرافة", "الفيل", "الكنغر", "الفرس"],
            answer: "الفيل"
        },
        {
            stage: 3,
            type: 'choice',
            question: "هل تعلم؟ حليب هذا الحيوان وسائله لونه وردي (Pink)! من هو؟",
            options: ["فرس النهر", "البقرة", "الجمل", "الغزال"],
            answer: "فرس النهر"
        },
        {
            stage: 4,
            type: 'text',
            question: "شكل هذا الحيوان: أبيض وأسود ويعيش في الثلج ويعشق السباحة، اكتب اسمه:",
            answer: "بطريق"
        },
        {
            stage: 5,
            type: 'choice',
            question: "من هو أسرع حيوان بري في العالم كله؟",
            options: ["الفهد", "الأسد", "الحصان", "الغزال"],
            answer: "الفهد"
        },
        {
            stage: 6,
            type: 'choice',
            question: "حيوان عملاق قلبه بحجم سيارة صغيرة! فمن يكون؟",
            options: ["الحوت الأزرق", "القرش الأبيض", "الفيل الأفريقي", "الدب القطبي"],
            answer: "الحوت الأزرق"
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let currentAudio = null;

    function startGame() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById('stage-number').innerText = `المرحلة: ${q.stage} / ${questions.length}`;
        document.getElementById('score-display').innerText = `النقاط: ${score}`;
        document.getElementById('question-text').innerText = q.question;
        document.getElementById('feedback-text').innerText = '';

        const soundSection = document.getElementById('sound-section');
        const optionsContainer = document.getElementById('options-container');
        const textSection = document.getElementById('text-input-section');

        soundSection.style.display = 'none';
        optionsContainer.style.display = 'none';
        textSection.style.display = 'none';

        if (q.type === 'sound') {
            soundSection.style.display = 'block';
            currentAudio = new Audio(q.soundUrl);
            renderOptions(q.options);
        } else if (q.type === 'choice') {
            renderOptions(q.options);
        } else if (q.type === 'text') {
            textSection.style.display = 'flex';
            document.getElementById('user-answer-input').value = '';
        }
    }

    function playSound() {
        if (currentAudio) currentAudio.play();
    }

    function renderOptions(options) {
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        container.style.display = 'grid';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkChoiceAnswer(opt);
            container.appendChild(btn);
        });
    }

    function checkChoiceAnswer(selected) {
        const q = questions[currentQuestionIndex];
        if (selected === q.answer) {
            score += 10;
            document.getElementById('feedback-text').style.color = '#00b894';
            document.getElementById('feedback-text').innerText = 'إجابة صحيحة! 🌟';
            setTimeout(nextQuestion, 1000);
        } else {
            document.getElementById('feedback-text').style.color = '#d63031';
            document.getElementById('feedback-text').innerText = 'حاول مرة أخرى! 🔄';
        }
    }

    function checkTextAnswer() {
        const input = document.getElementById('user-answer-input').value.trim();
        const q = questions[currentQuestionIndex];
        if (input.includes(q.answer)) {
            score += 10;
            document.getElementById('feedback-text').style.color = '#00b894';
            document.getElementById('feedback-text').innerText = 'إجابة صحيحة! أحسنت 🌟';
            setTimeout(nextQuestion, 1000);
        } else {
            document.getElementById('feedback-text').style.color = '#d63031';
            document.getElementById('feedback-text').innerText = 'إجابة خاطئة، حاول ثانية!';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('end-screen').style.display = 'flex';
    }

    function playSajaGreeting() {
        const msg = new SpeechSynthesisUtterance();
        msg.text = "Congratulations kids! You did a fantastic job! Designed by Saja.";
        msg.lang = 'en-US';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    }

    function restartGame() {
        startGame();
    }
</script>

</body>
</html>

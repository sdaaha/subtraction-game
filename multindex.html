<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة حساب الضرب - الصف الثاني الابتدائي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-bg: #ffffff;
            --text-dark: #2d3436;
            --secondary: #0984e3;
            --success: #2ecc71;
            --error: #e74c3c;
            --primary: #fdcb6e;
            --bg-gradient: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 20px;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 900px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 25px;
            position: relative;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                order: 2;
            }
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .sidebar {
            background: #ffeaa7;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .avatar-box {
            background: white;
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }

        h1 {
            color: #d63031;
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            font-weight: 900;
        }

        .subtitle {
            color: #d63031;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .input-group {
            margin: 20px 0;
            width: 100%;
            max-width: 300px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #e17055;
        }

        .btn {
            background: linear-gradient(135deg, #e17055, #d63031);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(214, 48, 49, 0.3);
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(214, 48, 49, 0.4);
        }

        .math-card {
            background: #f1f2f6;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            margin: 15px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .equation {
            font-size: 2.5rem;
            font-weight: 900;
            color: #2d3436;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-btn {
            background: white;
            border: 2px solid #dfe6e9;
            padding: 12px;
            font-size: 1.4rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #2d3436;
        }

        .option-btn:hover {
            border-color: #e17055;
            background: #ffeaa7;
        }

        .score-board {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #dfe6e9;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #2ecc71;
            width: 0%;
            transition: width 0.3s;
        }

        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        .stars {
            font-size: 2rem;
            color: #f1c40f;
            margin: 10px 0;
        }

        .feedback-pop {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .feedback-pop.correct {
            background: #2ecc71;
            opacity: 1;
        }

        .feedback-pop.wrong {
            background: #e74c3c;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="feedback" class="feedback-pop"></div>

    <div class="container">
        
        <!-- الشريط الجانبي للشخصيات -->
        <div class="sidebar">
            <div class="avatar-box">
                <svg width="80" height="80" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="#ffeaa7"/>
                    <circle cx="35" cy="40" r="6" fill="#2d3436"/>
                    <circle cx="65" cy="40" r="6" fill="#2d3436"/>
                    <path d="M 35 65 Q 50 80 65 65" stroke="#2d3436" stroke-width="5" fill="none"/>
                </svg>
                <div style="font-weight:700; margin-top:5px;">مرحباً يا بطل!</div>
            </div>
            
            <div style="font-size: 2rem;">⭐ ✖️ ✨</div>

            <div class="avatar-box">
                <svg width="80" height="80" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="#e17055"/>
                    <circle cx="35" cy="40" r="6" fill="#fff"/>
                    <circle cx="65" cy="40" r="6" fill="#fff"/>
                    <path d="M 35 60 Q 50 75 65 60" stroke="#fff" stroke-width="5" fill="none"/>
                </svg>
                <div style="font-weight:700; margin-top:5px;">هيا نتعلم الضرب!</div>
            </div>
        </div>

        <!-- المنطقة الرئيسية للمحتوى -->
        <div class="main-content">

            <!-- شاشة البداية -->
            <div id="start-screen" class="screen active">
                <h1>✖️ مغامرة حساب الضرب ✖️</h1>
                <div class="subtitle">للصف الثاني الابتدائي</div>
                
                <div class="input-group">
                    <input type="text" id="player-name" placeholder="اكتب اسم الطالب ✏️">
                </div>

                <button class="btn" onclick="startGame()">ابدأ المغامرة 🚀</button>
            </div>

            <!-- شاشة اللعب -->
            <div id="game-screen" class="screen">
                <div class="score-board">
                    <span>اللاعب: <strong id="display-name"></strong></span>
                    <span>النقاط: <strong id="score">0</strong> ⭐</span>
                    <span>المرحلة: <strong id="level">1</strong></span>
                </div>

                <div class="progress-bar">
                    <div id="progress" class="progress-fill"></div>
                </div>

                <div class="math-card">
                    <div id="equation" class="equation">2 × 3 = ?</div>
                    <div id="options" class="options-grid">
                        <!-- الخيارات ستولد بالسوفت وير -->
                    </div>
                </div>
            </div>

            <!-- شاشة النهاية -->
            <div id="end-screen" class="screen">
                <h1>🎉 أحسنت يا بطل! 🎉</h1>
                <div class="stars">⭐⭐⭐</div>
                <p style="font-size: 1.3rem;">لقد أتقنت جدول الضرب بنجاح!</p>
                <p style="font-size: 1.1rem; color: #636e72;">مجموع نقاطك: <strong id="final-score">0</strong></p>
                <button class="btn" onclick="resetGame()">العب مرة أخرى 🔄</button>
            </div>

        </div>

    </div>

    <script>
        // نظام إيجاد الأصوات التفاعلية المباشرة (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                // نغمة نجاح مشجعة
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                // نغمة خطأ خفيفة
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } else if (type === 'win') {
                // نغمة الاحتفال بالفوز
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const oscW = audioCtx.createOscillator();
                    const gainW = audioCtx.createGain();
                    oscW.connect(gainW);
                    gainW.connect(audioCtx.destination);
                    oscW.frequency.value = freq;
                    gainW.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.12);
                    gainW.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.12 + 0.3);
                    oscW.start(audioCtx.currentTime + idx * 0.12);
                    oscW.stop(audioCtx.currentTime + idx * 0.12 + 0.3);
                });
            }
        }

        // بنك أسئلة الضرب للصف الثاني الابتدائي (جدول 1، 2، 3، 4، 5)
        const questions = [
            // المرحلة 1: جدول 1 و 2
            { num1: 2, num2: 2, ans: 4, level: 1 },
            { num1: 2, num2: 3, ans: 6, level: 1 },
            { num1: 1, num2: 5, ans: 5, level: 1 },
            { num1: 2, num2: 4, ans: 8, level: 1 },

            // المرحلة 2: جدول 3 و 4
            { num1: 3, num2: 3, ans: 9, level: 2 },
            { num1: 3, num2: 4, ans: 12, level: 2 },
            { num1: 4, num2: 4, ans: 16, level: 2 },
            { num1: 3, num2: 5, ans: 15, level: 2 },

            // المرحلة 3: جدول 5 وتحدي المراحل
            { num1: 4, num2: 5, ans: 20, level: 3 },
            { num1: 5, num2: 5, ans: 25, level: 3 },
            { num1: 2, num2: 6, ans: 12, level: 3 },
            { num1: 3, num2: 6, ans: 18, level: 3 }
        ];

        let currentQuestion = 0;
        let score = 0;
        let playerName = "";

        function startGame() {
            const nameInput = document.getElementById('player-name').value;
            if (nameInput.trim() === "") {
                alert("لطفاً اكتب اسمك لنبدأ اللعب!");
                return;
            }
            playerName = nameInput;
            document.getElementById('display-name').innerText = playerName;
            
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('equation').innerText = `${q.num1} × ${q.num2} = ?`;
            document.getElementById('level').innerText = q.level;
            
            // تحديث شريط التقدم
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress').style.width = `${progressPercent}%`;

            // توليد خيارات الإجابة
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            let choices = [q.ans];
            while(choices.length < 4) {
                let wrongAns = q.ans + (Math.floor(Math.random() * 8) - 4);
                if(wrongAns > 0 && !choices.includes(wrongAns)) {
                    choices.push(wrongAns);
                }
            }
            
            // خلط الخيارات عشوائياً
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(choice, q.ans);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            const feedback = document.getElementById('feedback');
            
            if (selected === correct) {
                playSound('correct');
                score += 10;
                document.getElementById('score').innerText = score;
                feedback.innerText = "إجابة صحيحة! بطل ✨";
                feedback.className = "feedback-pop correct";
            } else {
                playSound('wrong');
                feedback.innerText = `إجابة خاطئة! الناتج الصحيح هو ${correct} ❌`;
                feedback.className = "feedback-pop wrong";
            }

            setTimeout(() => {
                feedback.className = "feedback-pop";
            }, 1500);

            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showEndScreen();
            }
        }

        function showEndScreen() {
            playSound('win');
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('end-screen').classList.add('active');
            document.getElementById('final-score').innerText = score;
        }

        function resetGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('end-screen').classList.remove('active');
            document.getElementById('start-screen').classList.add('active');
        }
    </script>
</body>
</html>

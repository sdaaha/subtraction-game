<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة عالم الحيوانات التفاعلية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --yellow: #FFE66D;
            --dark: #2F2E41;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
            position: relative;
            border: 6px solid #FFF;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* الشخصيات */
        .avatars-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: var(--yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            border: 4px solid var(--dark);
            box-shadow: 0 8px 0 var(--dark);
        }

        h1 { color: var(--dark); font-size: 2.2rem; margin-bottom: 10px; }
        p { color: #555; font-size: 1.2rem; font-weight: bold; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #d93838;
            transition: all 0.2s;
            margin-top: 15px;
            font-family: 'Cairo', sans-serif;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #d93838; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d93838; }

        .audio-btn {
            background: var(--secondary);
            box-shadow: 0 6px 0 #2ca8a0;
            margin-bottom: 20px;
        }

        /* خيارات الإجابة */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .option-card {
            background: white;
            border: 3px solid #E0E0E0;
            border-radius: 20px;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .option-card:hover {
            border-color: var(--secondary);
            transform: scale(1.03);
            background: #F0FFFF;
        }

        .option-card .icon { font-size: 45px; }

        /* شريط التقدم */
        .progress-bar {
            height: 12px;
            background: #E0E0E0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--secondary);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

<div class="game-container">

    <!-- شريط التقدم -->
    <div class="progress-bar" id="progressContainer" style="display: none;">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- 1. شاشة البداية -->
    <div id="start-screen" class="screen active">
        <h1>🐾 مغامرة عالم الحيوانات 🐾</h1>
        <p>هل أنت جاهز لاكتشاف أسرار الحيوانات مع أبطالنا؟</p>
        
        <div class="avatars-container">
            <div class="avatar" title="الولد">👦🏻</div>
            <div class="avatar" title="البنت">👧🏽</div>
        </div>

        <button class="btn" onclick="startGame()">ابدأ اللعبة الآن! 🚀</button>
    </div>

    <!-- 2. شاشة الأسئلة التفاعلية -->
    <div id="quiz-screen" class="screen">
        <h2 id="stage-title" style="color: var(--primary);">المرحلة 1</h2>
        <h3 id="question-text" style="color: var(--dark); font-size: 1.4rem;">عنوان السؤال</h3>
        
        <button id="sound-play-btn" class="btn audio-btn" onclick="playAnimalSound()" style="display: none;">
            🔊 استمع للصوت
        </button>

        <div class="options-grid" id="options-container">
            <!-- الإجابات تتولد هنا بواسطة JavaScript -->
        </div>
    </div>

    <!-- 3. شاشة النهاية والاحتفال -->
    <div id="end-screen" class="screen">
        <h1>🎉 أبدعت يا بطل! 🎉</h1>
        <p>لقد أتممت جميع مراحل اللعبة بنجاح وأصبحت خبيراً في عالم الحيوانات!</p>
        
        <div class="avatars-container">
            <div class="avatar">👦🏻</div>
            <div class="avatar">👧🏽</div>
        </div>

        <button class="btn audio-btn" onclick="playSajaVoice()">
            🎙️ استمع لتهنئة ENG Saja
        </button>
        <br>
        <button class="btn" onclick="restartGame()">العب من جديد 🔄</button>
    </div>

</div>

<script>
    // بيانات مراحل اللعبة والأسئلة (6 مراحل متنوعة)
    const stages = [
        {
            title: "المرحلة 1: من صاحب هذا الصوت؟ 🔊",
            question: "اضغط على زر الصوت واستمع جيداً.. لمن ينتمي هذا الزئير القوي؟",
            hasAudio: true,
            soundUrl: "https://www.soundjay.com/nature/sounds/lion-roar-1.mp3",
            options: [
                { text: "الأسد", icon: "🦁", correct: true },
                { text: "الفيل", icon: "🐘", correct: false },
                { text: "الذئب", icon: "🐺", correct: false }
            ]
        },
        {
            title: "المرحلة 2: صفات نادرة 🔍",
            question: "أنا الحيوان البري الوحيد الذي لا يستطيع القفز إطلاقاً! فمن أكون؟",
            hasAudio: false,
            options: [
                { text: "الزرافة", icon: "🦒", correct: false },
                { text: "الفيل", icon: "🐘", correct: true },
                { text: "الكنغر", icon: "🦘", correct: false }
            ]
        },
        {
            title: "المرحلة 3: الموطن والبيئة ❄️",
            question: "أنا طائر يعشق السباحة والغوص في الثلج، ولكنني لا أستطيع الطيران! من أنا؟",
            hasAudio: false,
            options: [
                { text: "البطريق", icon: "🐧", correct: true },
                { text: "النسر", icon: "🦅", correct: false },
                { text: "البومة", icon: "🦉", correct: false }
            ]
        },
        {
            title: "المرحلة 4: أسرار وألوان الطبيعة 🎨",
            question: "هل تعلم أن هذا الحيوان يفرز سائلاً يظهر وحليبه يبدو بلون وردي (Pink)؟",
            hasAudio: false,
            options: [
                { text: "فرس النهر", icon: "🦛", correct: true },
                { text: "البقرة", icon: "🐄", correct: false },
                { text: "الجمل", icon: "🐪", correct: false }
            ]
        },
        {
            title: "المرحلة 5: التحدي الإنكليزي 🇬🇧",
            question: "ما اسم أسرع حيوان بري في العالم باللغة الإنكليزية؟ (Cheetah)",
            hasAudio: false,
            options: [
                { text: "الفهد (Cheetah)", icon: "🐆", correct: true },
                { text: "الأسد (Lion)", icon: "🦁", correct: false },
                { text: "الأرنب (Rabbit)", icon: "🐰", correct: false }
            ]
        },
        {
            title: "المرحلة 6: أبطال الحجم الخارق 🏆",
            question: "حيوان عملاق تمتلك بعض أنواعه قلباً بحجم سيارة صغيرة! فمن يكون؟",
            hasAudio: false,
            options: [
                { text: "الحوت الأزرق", icon: "🐋", correct: true },
                { text: "القرش الأبيض", icon: "🦈", correct: false },
                { text: "الدب القطبي", icon: "🐻‍❄️", correct: false }
            ]
        }
    ];

    let currentStage = 0;

    // الأصوات التفاعلية للإجابات
    const correctAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');
    const wrongAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3');
    let animalAudio = null;

    function startGame() {
        currentStage = 0;
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('end-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        document.getElementById('progressContainer').style.display = 'block';
        loadStage();
    }

    function loadStage() {
        const stage = stages[currentStage];
        
        // تحديث شريط التقدم
        const progressPercent = ((currentStage + 1) / stages.length) * 100;
        document.getElementById('progressFill').style.width = progressPercent + '%';

        document.getElementById('stage-title').innerText = stage.title;
        document.getElementById('question-text').innerText = stage.question;

        // إدارة زر الصوت
        const soundBtn = document.getElementById('sound-play-btn');
        if (stage.hasAudio) {
            soundBtn.style.display = 'inline-block';
            animalAudio = new Audio(stage.soundUrl);
        } else {
            soundBtn.style.display = 'none';
        }

        // بناء الإجابات
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        stage.options.forEach(opt => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.innerHTML = `<span class="icon">${opt.icon}</span><span>${opt.text}</span>`;
            card.onclick = () => checkAnswer(opt.correct);
            optionsContainer.appendChild(card);
        });
    }

    function playAnimalSound() {
        if (animalAudio) {
            animalAudio.play();
        }
    }

    function checkAnswer(isCorrect) {
        if (isCorrect) {
            correctAudio.play();
            alert("أحسنت! إجابة صحيحة 🌟");
            currentStage++;
            if (currentStage < stages.length) {
                loadStage();
            } else {
                showEndScreen();
            }
        } else {
            wrongAudio.play();
            alert("حاول مرة أخرى! 🔄");
        }
    }

    function showEndScreen() {
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('end-screen').classList.add('active');
        document.getElementById('progressContainer').style.display = 'none';
    }

    function playSajaVoice() {
        // تحويل النص الإنكليزي إلى صوت تفاعلي باستخدام Web Speech API
        const msg = new SpeechSynthesisUtterance();
        msg.text = "Great job, hero! You did an amazing job and completed all stages! You are now a certified Animal Expert!";
        msg.lang = 'en-US';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    }

    function restartGame() {
        startGame();
    }
</script>

</body>
</html>
